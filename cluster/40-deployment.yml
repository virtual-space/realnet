apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: gitlab
  name: gitlab
  labels:
    app: gitlab
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:15.11.11-ce.0
          imagePullPolicy: IfNotPresent
          volumeMounts:
           - name: config-volume
             mountPath: /etc/gitlab
           - name: logs-volume
             mountPath: /var/log/gitlab
           - name: data-volume
             mountPath: /var/opt/gitlab
           - name: reg-volume
             mountPath: /var/opt/gitlab/gitlab-rails/shared/registry
           - name: uploads-volume
             mountPath: /var/opt/gitlab/gitlab-rails/uploads
           - name: gitlab-configmap-volume
             mountPath: /etc/gitlab/gitlab.rb
             subPath: gitlab.rb
          ports:
            - name: http-web
              containerPort: 80
            - name: tcp-ssh
              containerPort: 22
            - name: http-reg
              containerPort: 5050
      volumes:
        - name: gitlab-configmap-volume
          configMap:
           name: gitlab-config
        - name: config-volume
          hostPath:
           path: /Users/marko/srv/gitlab/config
        - name: logs-volume
          hostPath:
           path: /Users/marko/srv/gitlab/logs
        - name: data-volume
          hostPath:
           path: /Users/marko/srv/gitlab/data
        - name: reg-volume
          hostPath:
           path: /Users/marko/srv/gitlab/reg
        - name: uploads-volume
          hostPath:
           path: /Users/marko/srv/gitlab/uploads
